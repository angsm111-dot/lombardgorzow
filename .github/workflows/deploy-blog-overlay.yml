name: Deploy unique blog covers to JDM preview

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/blog-overlay-unique-covers
    paths:
      - deploy/blog-archive.part-*
      - deploy/jdm_known_hosts_web13
      - deploy-blog-overlay.py

permissions:
  contents: read

concurrency:
  group: jdm-blog-overlay
  cancel-in-progress: false

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned SSH library
        run: python -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Install blog overlay with host key verification
        env:
          JDM_PASSWORD: ${{ secrets.JDM_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python deploy-blog-overlay.py
