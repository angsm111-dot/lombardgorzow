name: Publish Sezam to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /lombardgorzow/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for path in "" "gotowka/" "skup-zlota/" "kontakt/" "wersje/" "wersja-1/" "wersja-2/" "wersja-3/" "wersja-4/" "wersja-5/" "impuls-wersje/" "wersja-6/" "wersja-7/" "wersja-8/" "wersja-9/" "wersja-10/" "nowe-wersje/" "wersja-11/" "wersja-12/" "wersja-13/" "wersja-14/" "wersja-15/"; do
            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "${SITE_URL%/}/$path" -o /tmp/sezam-page.html
            test -s /tmp/sezam-page.html
          done
          echo "Public home and service pages respond successfully."
