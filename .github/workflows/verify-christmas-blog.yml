name: Verify published Christmas jewellery article
on:
  push:
    branches:
      - deploy/blog-overlay-unique-covers
    paths:
      - .github/workflows/verify-christmas-blog.yml
      - scripts/check-christmas-blog-live.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser check library
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Check published article in Chrome at desktop and mobile widths
        run: python scripts/check-christmas-blog-live.py
      - name: Save public verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-2026-browser-verification
          path: qa/
          if-no-files-found: ignore
          retention-days: 30
